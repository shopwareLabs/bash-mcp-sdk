name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install ShellCheck
        run: |
          SHELLCHECK_VERSION="v0.11.0"
          ARCH=$(uname -m)  # x86_64 or aarch64 on GitHub runners
          wget -q "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.${ARCH}.tar.xz"
          tar -xJf "shellcheck-${SHELLCHECK_VERSION}.linux.${ARCH}.tar.xz"
          sudo mv "shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/
          shellcheck --version

      - name: ShellCheck
        run: |
          find lib tests scripts .github/scripts -type f \
            \( -name '*.sh' -o -name '*.bats' -o -name '*.bash' \) \
            -exec shellcheck --shell=bash --format=gcc {} +

  test:
    name: BATS (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, alpine]
        include:
          - distro: bash-4.1
            base_image: bash:4.1
          - distro: bash-4.2
            base_image: bash:4.2
          - distro: bash-4.3
            base_image: bash:4.3
          - distro: bash-4.4
            base_image: bash:4.4
          - distro: bash-5.0
            base_image: bash:5.0
          - distro: bash-5.1
            base_image: bash:5.1
          - distro: bash-5.3
            base_image: bash:5.3

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup BATS
        run: ./.github/scripts/setup-bats.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker
          file: docker/${{ startsWith(matrix.distro, 'bash-') && 'alpine' || matrix.distro }}.Dockerfile
          build-args: ${{ matrix.base_image && format('BASE_IMAGE={0}', matrix.base_image) || '' }}
          load: true
          push: false
          tags: bash-mcp-sdk-test:${{ matrix.distro }}
          cache-from: type=registry,ref=ghcr.io/shopwarelabs/bash-mcp-sdk/test-cache:${{ matrix.distro }}
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref=ghcr.io/shopwarelabs/bash-mcp-sdk/test-cache:{0},mode=max', matrix.distro) || '' }}

      - name: BATS
        run: ./scripts/test-linux.sh --no-build ${{ matrix.distro }}
